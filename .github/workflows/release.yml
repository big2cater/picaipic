name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      build_target:
        description: 'Target to build'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - x86_64-unknown-linux-gnu
          - aarch64-unknown-linux-gnu

permissions:
  contents: write

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - id: set-matrix
        run: |
          ALL_TARGETS='[{"platform":"ubuntu-22.04","target":"x86_64-unknown-linux-gnu","arch":"x86_64"},{"platform":"ubuntu-24.04-arm","target":"aarch64-unknown-linux-gnu","arch":"aarch64"}]'
          
          if [ "${{ github.event_name }}" == "workflow_dispatch" ] && [ "${{ github.event.inputs.build_target }}" != "all" ]; then
            SELECTED_TARGET=$(echo "$ALL_TARGETS" | jq -c "[.[] | select(.target == \"${{ github.event.inputs.build_target }}\")]")
            if [ "$SELECTED_TARGET" == "[]" ]; then
              echo "Error: Invalid target ${{ github.event.inputs.build_target }}"
              exit 1
            fi
            MATRIX=$(echo "$SELECTED_TARGET" | jq -c '{include: .}')
          else
            MATRIX=$(echo "$ALL_TARGETS" | jq -c '{include: .}')
          fi
          
          echo "Generated matrix: $MATRIX"
          echo "matrix=$MATRIX" >> $GITHUB_OUTPUT
  build:
    needs: setup
    runs-on: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.setup.outputs.matrix) }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install system dependencies (Linux only)
        if: startsWith(matrix.target, 'x86_64-unknown-linux') || startsWith(matrix.target, 'aarch64-unknown-linux')
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev libjpeg-turbo8-dev \
            nasm clang pkg-config libglib2.0-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev patchelf

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_OUTPUT

      - name: Cache pnpm dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            src-tauri/target/
          key: ${{ runner.os }}-${{ matrix.arch }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.arch }}-cargo-

      - name: Download FFmpeg Sidecars
        shell: bash
        run: bash scripts/download_ffmpeg_sidecar.sh ${{ matrix.platform }} ${{ matrix.arch }}

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
        working-directory: src-vite

      - name: Cache AI Models
        id: cache-ai-models
        uses: actions/cache@v4
        with:
          path: src-tauri/resources/models
          key: ${{ runner.os }}-models-${{ hashFiles('scripts/download_models.sh', 'scripts/download_models.ps1') }}

      - name: Download AI Models
        if: steps.cache-ai-models.outputs.cache-hit != 'true'
        shell: bash
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: bash scripts/download_models.sh

      - name: Clear cached Linux bundle artifacts
        if: startsWith(matrix.target, 'x86_64-unknown-linux') || startsWith(matrix.target, 'aarch64-unknown-linux')
        shell: bash
        run: rm -rf src-tauri/target/${{ matrix.target }}/release/bundle

      - name: Build and Sign (Linux ${{ matrix.arch }})
        if: startsWith(matrix.target, 'x86_64-unknown-linux') || startsWith(matrix.target, 'aarch64-unknown-linux')
        uses: tauri-apps/tauri-action@v0.5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APTABASE_KEY: ${{ secrets.APTABASE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: .
          args: --verbose --target ${{ matrix.target }} --bundles deb,appimage

      # Specific for Linux: upload .deb as artifact
      - name: Upload Build Artifact (Linux)
        if: startsWith(matrix.target, 'x86_64-unknown-linux') || startsWith(matrix.target, 'aarch64-unknown-linux')
        uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.arch }}
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/deb/*.deb
            src-tauri/target/${{ matrix.target }}/release/bundle/deb/*.sig
            src-tauri/target/${{ matrix.target }}/release/bundle/appimage/*.AppImage
          if-no-files-found: error

  # Create release after all builds complete
  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare release files
        run: |
          mkdir -p release-files
          find artifacts -name "*.deb" -exec cp {} release-files/ \;
          find artifacts -name "*.AppImage" -exec cp {} release-files/ \;
          find artifacts -name "*.sig" -exec cp {} release-files/ \; 2>/dev/null || true
          ls -la release-files/

      - name: Generate latest.json
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          echo "Processing version: $VERSION"
          
          # Find files for each architecture
          LINUX_X86_64_DEB=$(find release-files \( -name "*amd64*.deb" -o -name "*x86_64*.deb" \) | head -n 1)
          LINUX_AARCH64_DEB=$(find release-files \( -name "*arm64*.deb" -o -name "*aarch64*.deb" \) | head -n 1)
          
          echo "Found artifacts:"
          echo "  LINUX_X86_64_DEB: $LINUX_X86_64_DEB"
          echo "  LINUX_AARCH64_DEB: $LINUX_AARCH64_DEB"
          
          LINUX_X86_64_DEB_NAME=$(basename "$LINUX_X86_64_DEB" 2>/dev/null || echo "")
          LINUX_AARCH64_DEB_NAME=$(basename "$LINUX_AARCH64_DEB" 2>/dev/null || echo "")
          
          # Get signatures from .sig files (generated by tauri signer)
          LINUX_X86_64_SIG=""
          LINUX_AARCH64_SIG=""
          
          [ -f "${LINUX_X86_64_DEB}.sig" ] && LINUX_X86_64_SIG=$(cat "${LINUX_X86_64_DEB}.sig")
          [ -f "${LINUX_AARCH64_DEB}.sig" ] && LINUX_AARCH64_SIG=$(cat "${LINUX_AARCH64_DEB}.sig")
          
          echo "Signatures found: "
          echo "  LINUX_X86_64: ${#LINUX_X86_64_SIG} chars"
          echo "  LINUX_AARCH64: ${#LINUX_AARCH64_SIG} chars"
          
          # Create latest.json
          cat > release-files/latest.json <<EOF
          {
            "version": "${VERSION}",
            "notes": "See the release notes on GitHub for details.",
            "pub_date": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "platforms": {
              "linux-x86_64": {
                "signature": "${LINUX_X86_64_SIG}",
                "url": "https://github.com/${{ github.repository }}/releases/download/v${VERSION}/${LINUX_X86_64_DEB_NAME}"
              },
              "linux-aarch64": {
                "signature": "${LINUX_AARCH64_SIG}",
                "url": "https://github.com/${{ github.repository }}/releases/download/v${VERSION}/${LINUX_AARCH64_DEB_NAME}"
              }
            }
          }
          EOF
          
          echo "Generated latest.json:"
          cat release-files/latest.json

      - name: Remove sig files before release
        run: |
          find release-files -name "*.sig" -delete 2>/dev/null || true
          echo "Final release files:"
          ls -la release-files/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-files/*
          draft: true
          prerelease: false
          generate_release_notes: true
